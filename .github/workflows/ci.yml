name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SyncIt.sln
      - run: dotnet build SyncIt.sln -c Release --no-restore
      - run: dotnet test SyncIt.sln -c Release --no-build --verbosity normal
